name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 1.2.3). Defaults to the tag name.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ matrix.rid }} (single-file, framework-dependent)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $override = '${{ inputs.version }}'
          $refName = '${{ github.ref_name }}'
          if (-not [string]::IsNullOrWhiteSpace($override)) {
            $version = $override.TrimStart('v')
          } elseif ($refName -match '^v(?<v>.+)$') {
            $version = $Matches.v
          } else {
            $version = "0.0.0-ci.${{ github.run_number }}"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Publish single-file (framework-dependent)
        run: dotnet publish src/TokenHound.App/TokenHound.App.csproj -c Release -r ${{ matrix.rid }} --self-contained false -p:PublishSingleFile=true -p:Version=${{ steps.version.outputs.value }} -o publish/${{ matrix.rid }} --nologo

      - name: Pack artifact
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath TokenHound-${{ steps.version.outputs.value }}-${{ matrix.rid }}-fxdependent.zip

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $arch = 'x64'
          if ('${{ matrix.rid }}' -eq 'win-arm64') { $arch = 'arm64' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.value }}" "/DPublishDir=$PWD\publish\${{ matrix.rid }}" "/DOutputDir=$PWD\dist" "/DMyAppArch=$arch" installer/TokenHound.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TokenHound-${{ matrix.rid }}
          path: |
            TokenHound-*.zip
            dist/*.exe
          retention-days: 30

  release:
    name: GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*Setup*.exe
          generate_release_notes: true
