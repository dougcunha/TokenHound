name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build + test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TokenHound.slnx --nologo

      - name: Build (Release)
        run: dotnet build TokenHound.slnx --no-restore -c Release --nologo

      # MTP executable route: `dotnet test` orchestration discovers zero tests
      # with this xunit.v3 MTP host (exit 5), at solution and project level,
      # so each test project runs as an MTP executable after the Release build.
      - name: Test
        shell: pwsh
        run: |
          $projects = @(
            'tests/TokenHound.Core.Tests/TokenHound.Core.Tests.csproj',
            'tests/TokenHound.Infrastructure.Tests/TokenHound.Infrastructure.Tests.csproj'
          )
          foreach ($project in $projects) {
            dotnet run --project $project --no-build --no-restore -c Release -- --minimum-expected-tests 1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $refName = '${{ github.ref_name }}'
          if ($refName -match '^v(?<v>.+)$') {
            $version = $Matches.v
          } else {
            $version = "0.0.0-ci.${{ github.run_number }}"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Publish single-file (framework-dependent, win-x64)
        run: dotnet publish src/TokenHound.App/TokenHound.App.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:Version=${{ steps.version.outputs.value }} -o publish/win-x64 --nologo

      - name: Upload single-file artifact
        uses: actions/upload-artifact@v4
        with:
          name: TokenHound-win-x64-singlefile
          path: publish/win-x64/
          retention-days: 7

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $arch = 'x64'
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.value }}" "/DPublishDir=$PWD\publish\win-x64" "/DOutputDir=$PWD\dist" "/DMyAppArch=$arch" installer/TokenHound.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TokenHound-Setup-win-x64
          path: dist/TokenHound-Setup-*.exe
          retention-days: 30
